# No se despliega al ejecutar npm start. Importar en Render cuando decidas publicar.
services:
  - type: web
    name: mi-pequeno-refugio
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: refugio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PRIVATE_DIR
        value: /var/data/refugio
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFICATION_TO
        sync: false
