services:
  - type: web
    name: paraelamordemivida
    runtime: node
    plan: free
    buildCommand: npm install && npm run vendor-assets
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ParaElAmorDeMiVida
      - key: MONGODB_COLLECTION
        value: ParaElAmorDeMiVida
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFICATION_TO
        sync: false
